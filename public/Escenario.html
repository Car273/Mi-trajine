<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8">
    <title>Ofrenda Día de Muertos - Trajinera</title>
    <link rel="icon" href= "asstes/fondo.jpeg" type="image/png">
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1033; }
        canvas { display: block; }
    </style>
</head>

<body>
    
<canvas id="myCanvas"></canvas>

<!-- Importmap para las librerías locales de Three.js -->
<script src="./font/ThePunkGrandmother.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/OrbitControls": "./js/OrbitControls.js"
    }
  }
</script>

<script type="module"> 

    import * as THREE from 'three'; 
    import { OrbitControls } from 'three/OrbitControls';
    import { FontLoader, Font } from './js/FontLoader.js';
    import { TextGeometry } from './js/TextGeometry.js';
    import crearTexto from "./props/Texto.js";
    import crearTrajinera from "./props/Trajinera.js";
    import crearRemo from "./props/Remo.js";
    import crearCuadroFoto1 from "./props/CuadroFoto1.js";
    import crearCuadroFoto2 from "./props/CuadroFoto2.js";
    import crearCuadroFoto3 from "./props/CuadroFoto3.js";
    import crearVela from "./props/Vela.js";
    import crearPanDeMuerto1 from "./props/PanDeMuerto1.js";
    import crearVasoAgua from "./props/VasoAgua.js";
    import crearCocaCola from "./props/VasoCocaCola.js";
    import crearCajaConFlores from "./props/CajaConFlores.js";
    import crearCaja from "./props/Caja.js";
    import crearCalaca1 from "./props/Calaca1.js";
    import crearCalaca2 from "./props/Calaca2.js";
    import crearCalaca3 from "./props/Calaca3.js";
    import crearAltar from "./props/Altar.js";
    import { crearFlorChica, crearFlorMediana, crearFlorGrande } from "./props/FlorCempasuchil.js";
    import crearMazapan from "./props/Mazapan.js";
    import crearFlan from "./props/Flan.js";
    import crearTiraPapelPicado1 from "./props/PapelPicado1.js";
    import crearPapelPicado2 from "./props/PapelPicado2.js";
    import crearJarron1 from "./props/Jarron1.js";

    // 🕹️ Renderer (Cambiamos a un tono de noche más obscuro)
    var renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('myCanvas'), 
        antialias: true,
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05050f); // 🌙 Fondo nocturno profundo

   // 🎬 Escena
    var scene = new THREE.Scene();

    // 🌌 CARGAR TEXTURA DE FONDO CON LAS ESTRELLAS
    var textureLoader = new THREE.TextureLoader();
    var texturaFondo = textureLoader.load('./asstes/trellas.jpg');
    scene.background = texturaFondo;

    // 🎥 Cámara
    var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 10, 28);
    scene.add(camera);

    // 🎛️ OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.dampingFactor = 0.1;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 3, 0);

    // 💡 Luces
    scene.add(new THREE.AmbientLight(0xffffff, 0.2));

    // Luz direccional muy bajita simular luz de luna tenue
    var luz = new THREE.DirectionalLight(0x8899cc, 0.3);
    luz.position.set(10, 30, 20);
    scene.add(luz);

    // 🌊 PISO GENERAL CON EFECTO DE AGUA
    var pisoGeo = new THREE.PlaneGeometry(60, 60);
    var pisoMat = new THREE.MeshStandardMaterial({ 
    color: 0x00695c,       // Tono azul verdoso (tipo agua profunda/canales)
    roughness: 0.1,        // Muy bajo para que sea muy brilloso (efecto espejo/reflejo)
    metalness: 0.2,        // Un ligero toque metálico para darle brillo al agua
    side: THREE.DoubleSide 
    });

    var piso = new THREE.Mesh(pisoGeo, pisoMat);
    piso.rotation.x = -Math.PI / 2;
    piso.position.y = -0.02;
    scene.add(piso);

    // 🏛️ INSTANCIAR Y AGREGAR LA TRAJINERA A LA ESCENA
    const miTrajinera = crearTrajinera({ x: 0, y: 0, z: 0 });
    scene.add(miTrajinera);

    // 🔤 TEXTO 3D
    const miTexto = crearTexto({ texto: 'Vanessa', x: 0, y: 6.8, z: 7.1 });
    scene.add(miTexto);

    // Colócalo en la escena (ajusta las coordenadas según prefieras)
    const papelPicadoFrente1 = crearTiraPapelPicado1({ x: 0, y: 5.3, z: 6.9, cantidad: 6 });
    scene.add(papelPicadoFrente1);

    // Colócalo en la escena (ajusta las coordenadas según prefieras)
    const papelPicadoFrente2 = crearTiraPapelPicado1({ x: 0, y: 5.3, z: -6.9, cantidad: 6 });
    scene.add(papelPicadoFrente2);

    const papelDerecha = crearPapelPicado2({ x: 4.8, y: 5.3, z: 0, cantidad: 6 });
    papelDerecha.rotation.y = Math.PI / 2;
    scene.add(papelDerecha);

    const papelIzquierda = crearPapelPicado2({ x: -4.8, y: 5.3, z: 0 });
    papelIzquierda.rotation.y = Math.PI / 2;
    scene.add(papelIzquierda);

    // Agregar el remo a un lado de la trajinera
    const miRemo = crearRemo({ x: 6, y: -1, z: -6.5 });
    miRemo.rotation.z = Math.PI / 12; 
    scene.add(miRemo);

    // Instanciar el altar pasando las coordenadas directas
    const miAltar = crearAltar({x: 0, y:  2.85, z: -3.4});
    scene.add(miAltar);

    //1.Colocar el cuadro sobre la mesa de la ofrenda
    const miCuadro1 = crearCuadroFoto1({ x: 0, y: 4.6, z: -3.5})
    scene.add(miCuadro1);

    //2.Colocar el cuadro sobre la mesa de la ofrenda
    const miCuadro2 = crearCuadroFoto2({ x: -0.6, y: 3.5, z: -1})
    scene.add(miCuadro2);

    //3.Colocar el cuadro sobre la mesa de la ofrenda
    const miCuadro3 = crearCuadroFoto3({ x: 1, y: 3.5, z: 0.8 })
    scene.add(miCuadro3);

    // 1.Veladora a la izquierda de la foto
    const vela1 = crearVela({ x: -0.9, y: 2.9, z: -2.1 });
    scene.add(vela1);

    // 2. Veladora a la derecha de la foto
    const vela2 = crearVela({ x: 0.9, y: 2.9, z: -2.1 });
    scene.add(vela2);

    // 3. Veladora a la izquierda de la foto
    const vela3 = crearVela({ x: -0.9, y: 2.9, z: 4 });
    scene.add(vela3);

    // 4. Veladora a la derecha de la foto
    const vela4 = crearVela({ x: 0.9, y: 2.9, z: 4 });
    scene.add(vela4);

    // 4. Veladora a la derecha de la foto
    const vela5 = crearVela({ x: 4.2, y: 1, z: 8});
    scene.add(vela5);

    // 4. Veladora a la derecha de la foto
    const vela6 = crearVela({ x: -4.2, y: 1, z: 8 });
    scene.add(vela6);

    // 🍞 Pan de muerto al centro de la mesa
    const miPan1 = crearPanDeMuerto1({ x: 0, y: 3.1, z: 1.5 });
    scene.add(miPan1);

    const vasoAgua = crearVasoAgua({ x: -0.9, y: 2.9, z: 2});
    scene.add(vasoAgua);

    // 🥤 Colocar la Coca-Cola
    const miCoca = crearCocaCola({ x: 0.8, y: 2.9, z: -1.2 });
    scene.add(miCoca);

    // 🌼 Colocar la caja con flores de cempasúchil en la ofrenda
    const miCajaFlores1 = crearCajaConFlores({ x: -3.4, y: 0.7, z: -8 });
    scene.add(miCajaFlores1);

    // Primera caja (a la izquierda)
    const cajaFlores2 = crearCajaConFlores({ x: 0.1, y: 0.7, z: -8 });
    scene.add(cajaFlores2);

    // Crear la caja y colocarla sobre la mesa
    const miCaja = crearCaja({ x: 3.5, y: 0.7, z: -8});
    scene.add(miCaja);

    // 💀 Primera calaverita (con una textura, por ejemplo, la de azúcar)
    const calaca1 = crearCalaca1({ x: -1.5, y: 3, z: -3.6,});
    scene.add(calaca1);

    // 💀 Segunda calaverita (con otra textura completamente diferente)
    const calaca2 = crearCalaca2({ x: 1.5, y: 3, z: -3.6}); 
    scene.add(calaca2);

    // 💀 Si quisieras una tercera con otra textura distinta:
    const calaca3 = crearCalaca3({ x: 0, y: 3, z: -2.4,});
    scene.add(calaca3);

    // 🌼 INSTANCIAR Y COLOCAR LAS FLORES
    const flor1 = crearFlorChica({x: 1.1, y: 3.8, z: -3.9});
    scene.add(flor1);

    // 🍮 INSTANCIAR EL FLAN EN LA MESA
    const miFlan = crearFlan({ x: 0.7, y: 2.8, z: -0.3 });
    scene.add(miFlan);

    // Instanciar el mazapán en la ofrenda
    const miMazapan = crearMazapan({ x: -0.7, y: 2.8, z: 0.3 });
   scene.add(miMazapan)
    
    //Flor 2
    const flor2 = crearFlorChica({ x: 1.1, y: 3.8,z: -3.1});
    scene.add(flor2);

    //Flor 3
    const flor3 = crearFlorChica({x: -1.1, y: 3.8, z: -3.1});
    scene.add(flor3);

    //Flor 4
    const flor4 = crearFlorChica();
    flor4.position.set(-1.1, 3.8, -3.9);
    scene.add(flor4);

    // 2. Declarar e instanciar cada flor del caminito
    const florCamino1 = crearFlorMediana({x: 0, y: 0.2, z: -8.5});
    scene.add(florCamino1);

    const florCamino2 = crearFlorChica({x: 0.2, y: 0.1, z: -9.8});
    scene.add(florCamino2);

    const florCamino3 = crearFlorGrande({x: -0.1, y: 0.2, z:-11.2});
    scene.add(florCamino3);

    const florCamino4 = crearFlorMediana({x: 0.3, y: 0.1, z: -12.8});
    scene.add(florCamino4);

    const florCamino5 = crearFlorChica({x: 0, y: 0.1, z: -14.5});
    scene.add(florCamino5);

    const miJarron = crearJarron1({ x: 0, y: 2.8, z: 3.2 });
    scene.add(miJarron);

    // 🎰 Rendering y animación
    let contador = 0;

    function render() {
    requestAnimationFrame(render);

    // 🌸 Movimiento flotante y desplazamiento hacia atrás (eje Z negativo o Y)
        
    
    florCamino1.position.z -= 0.02;
    florCamino2.position.z -= 0.02;
    florCamino3.position.z -= 0.02;
    florCamino4.position.z -= 0.02;
    florCamino5.position.z -= 0.02;

    controls.update();
    renderer.render(scene, camera);
}
    render();

    // 📐 Ajuste responsivo al cambiar el tamaño de la ventana
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
